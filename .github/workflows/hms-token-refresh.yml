name: HMS Token Auto Refresh

on:
  schedule:
    # Tiap 12 jam: 06:00 & 18:00 WIB
    - cron: '0 23 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  refresh-hms-tokens:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger refresh endpoint
        run: |
          echo "Triggering HMS refresh at $(date -u)"
          response=$(curl -fsS -X POST "${{ secrets.APP_URL }}/api/auth/refresh-hms?secret=${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          echo "Response:"
          echo "$response"