name: Clean Floor Snapshot 08:00 WIB

on:
  schedule:
    - cron: '5 1 * * *'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger clean floor snapshot
        run: |
          echo "Triggering at $(date -u '+%Y-%m-%d %H:%M UTC')"
          curl -fsS -X POST "${{ secrets.APP_URL }}/api/cron/snapshot-clean-floor" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120
